syntax = "proto3";

package swanlab.operation.v1;

option go_package = "github.com/swanhubx/swanlab/core/proto/swanlab/operation/v1;operationv1";

// Core 的生命周期状态。
enum CoreState {
    CORE_STATE_NOT_STARTED = 0; // Core 尚未启动
    CORE_STATE_RUNNING     = 1; // Core 正在运行（处理数据）
    CORE_STATE_FINISHED    = 2; // Core 已完成所有处理，可以安全退出
}

// 云端接入状态（用于延迟创建云端实验）。
enum CloudState {
    CLOUD_STATE_UNSPECIFIED = 0; // 未启用延迟接入
    CLOUD_STATE_PENDING     = 1; // 等待后端恢复并创建云端实验
    CLOUD_STATE_ATTACHED    = 2; // 已连接云端并取得实验路径
    CLOUD_STATE_FAILED      = 3; // 连接永久失败（认证失效或不可恢复错误）
}

// 当前/待上传文件进度快照；仅存在文件上传时填充。
message FileProgress {
    string path    = 1; // 文件路径
    int64 total    = 2; // 总字节数
    int64 uploaded = 3; // 已上传字节数
    double rate    = 4; // 上传速率（字节/秒）
}

// 上传通道投递状态；正常投递时各字段均为零值。
message UploadStatus {
    bool paused           = 1; // 是否已暂停出批（站点不可达或积压超预算）
    int64 pause_seq       = 2; // 本地入队暂停时的起始本地序号；未进入本地暂停时为 0
    int64 pending_records = 3; // 待确认的记录数
    int64 buffered_bytes  = 4; // 缓冲占用的字节数
    bool retrying         = 5; // 是否处于上传失败后的重试周期
    bool suspended        = 6; // 是否因站点降级暂停上传出批
}

// 云端接入状态快照（仅延迟接入模式填充）。
message CloudStatus {
    CloudState state = 1; // 云端接入状态
    string path      = 2; // 云端实验路径
    string error     = 3; // 失败或最近一次重试错误摘要
}

// Core 运行状态快照。
message OperationStats {
    CoreState state             = 1; // Core 生命周期状态
    int64 total_number          = 2; // 总文件数
    int64 uploaded_number       = 3; // 已完成文件数
    int64 total_records         = 4; // 已知总 Record 数；0 表示未知或未设置
    int64 uploaded_records      = 5; // 已终止处理 Record 数
    int64 total_size            = 6; // 总文件大小 (字节数)
    int64 uploaded_size         = 7; // 已完成文件大小 (字节数)
    double rate                 = 8; // 速率 (字节数/秒)
    repeated FileProgress files = 9; // 当前/待上传文件显示快照

    UploadStatus upload = 10; // 上传投递与积压
    CloudStatus cloud   = 11; // 云端接入状态
}
